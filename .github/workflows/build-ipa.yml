name: Build IPA

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build IPA
        env:
          WQ_SKIP_PREFLIGHT: '0'
          WQFILES_FINAL_IPA: ${{ github.workspace }}/WQFiles.ipa
        run: ./build.sh

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: WQFiles-IPA-${{ github.ref_name }}
          path: WQFiles.ipa
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" WQFiles.ipa --repo "$GITHUB_REPOSITORY" --title "WQ Files $GITHUB_REF_NAME" --generate-notes
